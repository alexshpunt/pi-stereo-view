name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Install search runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find
          mkdir -p "$RUNNER_TEMP/pi-stereo-view-bin"
          ln -s "$(command -v fdfind)" "$RUNNER_TEMP/pi-stereo-view-bin/fd"
          echo "$RUNNER_TEMP/pi-stereo-view-bin" >> "$GITHUB_PATH"
      - run: npm run check
      - run: npm pack --dry-run
